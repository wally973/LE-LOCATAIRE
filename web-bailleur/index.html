<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bailleur Le Locataire</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Interface Bailleur</h1>
      <p>Gestion des logements et des tickets associés</p>
    </header>

    <section id="login-section">
      <h2>Connexion Bailleur</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Mot de passe" />
      <button id="login-button">Se connecter</button>
      <div id="login-error" class="error"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="toolbar">
        <button id="logout-button">Se déconnecter</button>
      </div>
      <div class="panel">
        <h3>Vos logements</h3>
        <table id="housing-table">
          <thead>
            <tr><th>ID</th><th>Titre</th><th>Adresse</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="panel">
        <h3>Tickets associés</h3>
        <table id="tickets-table">
          <thead>
            <tr><th>ID</th><th>Titre</th><th>Statut</th><th>Action</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
